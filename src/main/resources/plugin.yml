name: AnaItemy
version: '1.0.0'
main: pl.anaheim.anaitemy.AnaItemy
api-version: '1.21'
authors: [ ]
description: Plugin dodający customowe przedmioty eventowe.
softdepend: [WorldGuard, Citizens, AnacodeAntylogout, WorldEdit, ProtocolLib]

commands:
  itemyeventowe:
    description: Otwiera GUI z itemami eventowymi.
    usage: /itemyeventowe [reload] [kills <liczba>] [give <id> <nick> <ilość>] [cooldown reset <nick>] [klatwa <naloz|zdejmij> <nick>]
    permission: anaitemy.admin
  ec:
    description: Otwiera enderchest.
    usage: /ec
    permission: anaitemy.ec
  ecsee:
    description: Podgląd enderchesta gracza.
    usage: /ecsee <nick>
    permission: anaitemy.ecsee
