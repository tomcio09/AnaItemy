  notify-attacker: false

# ==========================================
#         EXCALIBUR
# ==========================================
excalibur:
  material: NETHERITE_SWORD
  name: '&e&lExcalibur'
  custom-model-data: 5
  gui-slot: 1
  enchants:
    sharpness: 6
    fire-aspect: 2
    unbreaking: 3
  attack-speed: -1.6
  base-damage: 11.5
  max-damage: 12.0
  max-kills: 100
  bar-length: 18
  messages:
    kills-set: '&aUstawiono zabójstwa Excalibura na: &f{kills}'
