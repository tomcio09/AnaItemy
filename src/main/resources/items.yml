# ==========================================
#         AnaItemy - Konfiguracja Itemów
# ==========================================

# ==========================================
#         TOTEM UŁASKAWIENIA
# ==========================================
totem-ulaskawienia:
  # Materiał itemu
  material: TOTEM_OF_UNDYING
  # Nazwa itemu (obsługuje kody kolorów &)
  name: '&5&lTotem Ułaskawienia'
  # Opis itemu
  lore:
    - ''
    - ' &8» &7Jest to przedmiot z:'
    - ' &8» &feventu halloween (2023)'
    - ''
    - ' &8» &7Trzymając go po śmierci &dnie'
    - ' &8» &dstracisz &7swoich przedmiotów'
  # Custom Model Data
  custom-model-data: 1
  # Slot w GUI (0-53)
  gui-slot: 0
  # Wiadomość globalna po użyciu totemu
  messages:
    death: '&cGracz &7{victim} &czginął z &eTotemem Ułaskawienia&c!'
  # Zablokowane regiony WorldGuard (totem nie działa w tych regionach)
  blocked-regions: []

# ==========================================
#         EXCALIBUR
# ==========================================
excalibur:
  # Materiał itemu
  material: NETHERITE_SWORD
  # Nazwa itemu
  name: '&e&lExcalibur'
  # Custom Model Data
  custom-model-data: 5
  # Slot w GUI (0-53)
  gui-slot: 1
  # Enchanty
  enchants:
    sharpness: 6
    fire-aspect: 2
    unbreaking: 3
  # Atrybut prędkości ataku (domyślny miecz netheritowy to -2.4)
  attack-speed: -1.6
  # Bazowe obrażenia (przy 0 killach)
  base-damage: 11.5
  # Maksymalne obrażenia (przy max killach)
  max-damage: 12.0
  # Maksymalna liczba zabójstw do osiągnięcia max obrażeń
  max-kills: 100
  # Długość paska postępu (znaki)
  bar-length: 18
  # Wiadomości
  messages:
    kills-set: '&aUstawiono zabójstwa Excalibura na: &f{kills}'
    not-holding: '&cMusisz trzymać Excalibur w ręku!'
    invalid-number: '&cPodaj poprawną liczbę!'
    negative-number: '&cLiczba zabójstw nie może być ujemna!'
    too-fast: '&cZabójstwo nie zostało naliczone, ponieważ już zabiłeś tego gracza!'
  # Zablokowane regiony WorldGuard (kille nie liczą się w tych regionach)
  blocked-regions: []

# ==========================================
#         HYDRO KLATKA
# ==========================================
hydro-klatka:
  material: BLAZE_ROD
  name: '&3&lWyrzutnia Hydro Klatki'
  lore:
    - ''
    - ' &8» &7Jest to przedmiot zdobyty podczas'
    - ' &8» &fwydarzenia wakacyjnego 2025&7!'
    - ''
    - ' &8» &7Po użyciu wystrzeliwuje pocisk, który'
    - ' &8» &7tworzy &3wodną klatkę &7uwięziającą'
    - ' &8» &7przeciwników w miejscu!'
  custom-model-data: 2
  gui-slot: 2
  cooldown: 180
  
  cage:
    radius: 8
    duration: 10
    animation-duration: 60
  
  sounds:
    shoot:
      sound: ITEM_CROSSBOW_SHOOT
      volume: 2.0
      pitch: 1.0
    
    # ✅ USUNIĘTO custom sound - dodano splash + ambient
    
    # Dźwięk natychmiast po wybuchu
    splash:
      sound: ENTITY_GENERIC_SPLASH
      volume: 3.0
      pitch: 1.0
    
    # Dźwięk pod koniec animacji (głośny)
    # ✅ BLOCK_WATER_AMBIENT zamiast AMBIENT_UNDERWATER_LOOP
    ambient:
      sound: BLOCK_WATER_AMBIENT
      volume: 5.0
      pitch: 1.0
    
    cage-explode:
      sound: ENTITY_GENERIC_EXPLODE
      volume: 1.0
      pitch: 1.0
    
    cage-remove:
      sound: ENTITY_GENERIC_SPLASH
      volume: 1.5
      pitch: 1.2
    
    chunk-blocked:
      sound: BLOCK_GLASS_BREAK
      volume: 1.0
      pitch: 0.5
  
  bossbar:
    title: '&bHydroklatka'
    color: BLUE
  
  blocked-items:
    - ENDER_PEARL
    - EGG
    - FIRE_CHARGE
    - WATER_BUCKET
    - LAVA_BUCKET
    - CHORUS_FRUIT
  
  blocked-regions: 
    - spawn
    - endspawn
    - netherspawn
    - netherspawnpvp
  
  messages:
    cooldown: '&cNie możesz używać tego przedmiotu tak szybko!'
    chunk-blocked: '&cNie możesz w tym miejscu stworzyć klatki!'
    blocked-region: ''
    cannot-use-in-cage: '&cNie możesz tego zrobić w Hydro Klatce!'
  
  actionbar:
    cooldown-format: '&fStrzał z &3Hydro klatki &fza: &b{time}s'

# ==========================================
#         RÓŻDŻKA ILUZJONISTY
# ==========================================
rozdzka-iluzjonisty:
  # Materiał itemu
  material: GOLDEN_HOE
  # Nazwa itemu
  name: '&5&lRóżdżka Iluzjonisty'
  # Opis itemu
  lore:
    - ''
    - ' &8» &7Jest to przedmiot zdobyty podczas'
    - ' &8» &fwydarzenia cyrkowego 2025&7!'
    - ''
    - ' &8» &7LPM: przywołuje &dSzczęki Evokera'
    - ' &8» &7atakujące przeciwników na wprost.'
    - ''
    - ' &8» &7PPM: &dznikasz &7na &e4s &7i tworzysz'
    - ' &8» &dklona &7biegnącego do przodu.'
    - ''
  # Custom Model Data
  custom-model-data: 1
  # Slot w GUI (0-53)
  gui-slot: 3
  # Enchanty
  enchants:
    unbreaking: 10
  
  # === SZCZĘKI EVOKERA (LPM) ===
  fangs:
    # Cooldown (sekundy)
    cooldown: 20
    # Długość każdego paska szczęk (bloki)
    length: 7
    # Szerokość formacji (pasków)
    width: 3
    # Odstęp między paskami (bloki)
    spacing: 1.2
    # Damage pierwszej szczęki która trafi (połówki serc)
    damage: 12
    # Szybkość lotu szczęk (bloków/tick)
    speed: 0.3
    # Wiadomości
    messages:
      activated: '&aSzczęki Evokera &7zostały &aaktywowane&7!'
      cooldown-title: '&cUmiejętność w odnowieniu'
      cooldown-subtitle: '&7Do użycia za: &e{seconds}s'
  
  # === ZNIKNIĘCIE (PPM) ===
  vanish:
    # Cooldown (sekundy)
    cooldown: 60
    # Czas trwania zniknięcia (sekundy)
    duration: 4
    # Szybkość ruchu NPC
    npc-speed: 3.0
    # Dźwięki
    sounds:
      activate: ENTITY_ENDERMAN_AMBIENT
      deactivate: ENTITY_ENDERMAN_TELEPORT
    # Wiadomości
    messages:
      activated: '&aZniknięcie &7zostało &aaktywowane&7!'
      cooldown-title: '&cUmiejętność w odnowieniu'
      cooldown-subtitle: '&7Do użycia za: &e{seconds}s'
  
  # Zablokowane regiony WorldGuard
  blocked-regions:
    - spawn
    - endspawn
    - netherspawn
# ==========================================
#         WĘDKA NIELOTA
# ==========================================
wedka-nielota:
  material: FISHING_ROD
  name: '&5&lWędka nielota'
  lore:
    - ''
    - ' &8» &7Wędka nielota była do zdobycia'
    - ' &8» &7w &f2026 roku &7podczas &adnia dziecka'
    - ''
    - ' &8» &7Po złapaniu gracza na haczyk'
    - ' &8» &7nie może on odlecieć &delytrą!'
  custom-model-data: 2
  gui-slot: 4
  enchants: []
  
  curse-duration: 12
  cooldown: 30
  
  # ✅ Zwiększono prędkość bugowania z 2.0 na 3.5 bloków/s
  bugowanie-fall-speed: 2.0
  
  bugowanie-reset-duration: 4
  
  blocked-regions:
    - spawn
    - endspawn
  
  messages:
    caught-title: '&c&lZłapany!'
    caught-subtitle: '&7Złapany przez: &e{attacker}'
    catcher-title: '&a&lZłapałeś gracza!'
    catcher-subtitle: '&7Złapany gracz: &e{victim}'
    
    released-title: '&c&lPuścił cię!'
    released-subtitle: '&cPuścił cię gracz!'
    releaser-title: '&c&lPuściłeś gracza!'
    releaser-subtitle: '&cPuściłeś gracza!'
    
    freed-title: '&c&lUwolniony!'
    freed-subtitle: '&7Klątwa została zdjęta!'
    
    cooldown-message: '&cNie możesz użyć wędki tak szybko!'
    
  bossbar:
    title: '&cPosiadasz klątwę! Nie możesz latać przez &e{seconds}s'
    title-waiting: '&cPosiadasz klątwę! Nie możesz latać przez &e<1s'
    color: RED
# ==========================================
#         SAKIEWKA DROPU
# ==========================================
sakiewka-dropu:
  material: RABBIT_FOOT
  name: '&a&lSakiewka dropu'
  lore:
    - ''
    - ' &8» &7Posiadając ten przedmiot w'
    - ' &8» &7ekwipunku po &czabiciu &7dowolnego'
    - ' &8» &fgracza &7jego przedmioty trafiają'
    - ' &8» &7do twojej &asakiewki&7!'
    - ''
    - ' &8» &eKliknij PRAWYM, aby otworzyć sakiewkę!'
  custom-model-data: 1
  gui-slot: 5
  
  # Regiony gdzie nie można zbierać itemów do sakiewki
