  blocked-regions: []
  
  respects-protection: false
  notify-attacker: false

# ==========================================
#         HYDRO KLATKA
# ==========================================
hydro-klatka:
  material: BLAZE_ROD
  name: '&3&lWyrzutnia Hydro Klatki'
  lore:
    - ''
    - ' &8» &7Jest to przedmiot zdobyty podczas'
    - ' &8» &fwydarzenia wakacyjnego 2025&7!'
    - ''
    - ' &8» &7Po użyciu wystrzeliwuje pocisk, który'
    - ' &8» &7tworzy &3wodną klatkę &7uwięziającą'
    - ' &8» &7przeciwników w miejscu!'
  custom-model-data: 2
  gui-slot: 2
  cooldown: 180
  
  cage:
    radius: 8
    duration: 10
    animation-duration: 60
  
  sounds:
    shoot:
      sound: ITEM_CROSSBOW_SHOOT
      volume: 2.0
      pitch: 1.0
    
    splash:
      sound: ENTITY_GENERIC_SPLASH
      volume: 3.0
      pitch: 1.0
    
    ambient:
      sound: BLOCK_WATER_AMBIENT
      volume: 5.0
      pitch: 1.0
    
    cage-explode:
      sound: ENTITY_GENERIC_EXPLODE
      volume: 1.0
      pitch: 1.0
    
    cage-remove:
      sound: ENTITY_GENERIC_SPLASH
      volume: 1.5
      pitch: 1.2
    
    chunk-blocked:
      sound: BLOCK_GLASS_BREAK
      volume: 1.0
      pitch: 0.5
  
  bossbar:
    title: '&bHydroklatka'
    color: BLUE
  
  blocked-items:
    - ENDER_PEARL
    - EGG
    - FIRE_CHARGE
    - WATER_BUCKET
    - LAVA_BUCKET
    - CHORUS_FRUIT
  
  blocked-regions: 
    - spawn
    - endspawn
    - netherspawn
    - netherspawnpvp
  
  messages:
    cooldown: '&cNie możesz używać tego przedmiotu tak szybko!'
    chunk-blocked: '&cNie możesz w tym miejscu stworzyć klatki!'
    blocked-region: ''
    cannot-use-in-cage: '&cNie możesz tego zrobić w Hydro Klatce!'
  
  actionbar:
    cooldown-format: '&fStrzał z &3Hydro klatki &fza: &b{time}'
  
  respects-protection: false
  notify-attacker: false

