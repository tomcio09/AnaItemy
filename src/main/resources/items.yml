# ==========================================
#         BLOK WIDMO
# ==========================================
blok-widmo:
  material: STRUCTURE_BLOCK
  name: '&c&lBlok widmo'
  lore:
    - ''
    - ' &8» &7Jest to przedmiot zdobyty podczas'
    - ' &8» &fDnia Dziecka 2025&7!'
    - ''
    - ' &8» &7Po postawieniu na ziemi,'
    - ' &8» &7uwalnia &eenergię&7, która obniża'
    - ' &8» &fmaksymalny limit &7serc pobliskim'
    - ' &8» &7graczom na określony czas...'
  custom-model-data: 0
  gui-slot: 7
  enchants:
    unbreaking: 10
  
  # Promień działania (bloki)
  radius: 20
  
  # Czas trwania efektu (sekundy) - 2m40s = 160s
  effect-duration: 160
  
  # Ilość HP do zabrania z maksymalnego zdrowia (20 HP = 10 serduszek)
  health-reduction: 20
  
  # Minimalna ilość HP jaka może zostać (20 HP = 10 serduszek)
  minimum-health: 20
  
  # Cooldown (sekundy)
  cooldown: 180
  
  blocked-regions:
    - spawn
    - endspawn
    - netherspawn
  
  sounds:
    activate: BLOCK_BEACON_ACTIVATE
    deactivate: BLOCK_BEACON_DEACTIVATE
  
  bossbar:
    title: '&cBlok widmo: &fPosiadasz obniżony limit serc przez {time_left}'
    color: PURPLE
  
  messages:
    placed-subtitle: '&cPostawiono blok widmo!'
    affected-title: '&c&lBlok widmo'
    affected-subtitle: '&7coś się dzieje z twoim zdrowiem...'
    cooldown: '&cMusisz poczekać jeszcze {time_left} zanim będziesz mógł użyć tego przedmiotu ponownie!'
  
  respects-protection: false
  notify-attacker: false

